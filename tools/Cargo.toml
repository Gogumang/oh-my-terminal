[package]
name = "oh-my-terminal"
version = "0.1.0"
edition = "2021"
description = "회사 브랜드 색과 로고로 터미널 테마를 생성한다"

[[bin]]
name = "build-themes"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
ureq = { version = "2", features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
resvg = "0.45"
tiny-skia = "0.11"
write-fonts = { version = "0.38", features = ["read"] }
