[package]
name = "oh-my-terminal"
version = "0.1.0"
edition = "2021"
description = "회사 브랜드 색과 로고로 터미널 테마를 생성한다"

[[bin]]
name = "build-themes"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
# native-certs: 내장 루트 인증서 대신 OS 신뢰 저장소를 쓴다. 회사망처럼 TLS를 검사하는 프록시가
# 자체 루트 인증서로 다시 서명하면 내장 목록으로는 UnknownIssuer로 전부 실패했다.
ureq = { version = "2", features = ["tls", "native-certs"] }
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg"] }
resvg = "0.45"
tiny-skia = "0.11"
# README 테마 그림에 경로 글자를 그릴 때 기반 폰트의 외곽선을 읽는다. resvg가 이미 쓰는 판이다.
ttf-parser = "0.25"
# README 테마 그림을 256색 팔레트 PNG로 저장한다 (RGBA 대비 4분의 1 크기). image가 이미 쓰는 판이다.
color_quant = "1.1"
png = "0.18"
write-fonts = { version = "0.38", features = ["read"] }
